[project]
name = "hybrid-rag-cybersecurity"
version = "0.1.0"
description = "Hybrid RAG over Cybersecurity Internal Documents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.0",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "openpyxl>=3.1.5",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.45.0",
]

[project.scripts]
hybrid-rag-cybersecurity = "hybrid_rag_cybersecurity.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
